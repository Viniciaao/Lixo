name: Download Lilith Cloud + CC

on:
  push:
    paths:
      - '.github/workflows/download-cc.yml'
      - 'scripts/download_cc.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests cloudscraper

      - name: Download household + CC
        run: python scripts/download_cc.py

      - name: List results
        run: |
          find downloads -type f -exec ls -la {} \;
          cat downloads/manifest.json || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilith-cloud-downloads
          path: downloads/
          retention-days: 30
          if-no-files-found: warn

      - name: Commit downloads to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads
          git commit -m "CI: downloaded Lilith Cloud household + CC [skip ci]" || echo "nothing to commit"
          git push
