name: inspect-sources

on:
  push:
    branches: [arena/**]
    paths:
      - 'scripts/inspect_sources.sh'
      - '.github/workflows/inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run deep inspection
        run: |
          bash scripts/inspect_sources.sh 2>&1 | tee scripts/inspect_output.txt
          echo "inspect run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> scripts/inspect_output.txt
      - name: Commit inspect output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/inspect_output.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "inspect-results: update CC source inspection output"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "committed and pushed"
          fi
