name: probe-sources

on:
  push:
    branches: [arena/**]
    paths:
      - 'scripts/probe_sources.py'
      - '.github/workflows/probe.yml'
      - '.github/workflows/fetch.yml'
      - 'scripts/fetch_sources.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run source probe
        run: |
          python3 scripts/probe_sources.py 2>&1 | tee scripts/probe_output.txt
          echo "probe run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> scripts/probe_output.txt
      - name: Commit probe output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/probe_output.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "probe-results: update CC source probe output"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "committed and pushed"
          fi
      - name: Fallback - open issue with results
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "probe output (fallback)" \
            --body "$(cat scripts/probe_output.txt | head -200)" || true
