name: Download Gwen household + CC

on:
  push:
    paths:
      - '.github/workflows/download-gwen.yml'
      - 'scripts/download_gwen.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests cloudscraper

      - name: Download Gwen + required CC
        run: python scripts/download_gwen.py

      - name: List results
        run: |
          find downloads-gwen -type f -exec ls -la {} \;

      - name: Commit downloads to branch
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-remote origin refs/heads/arena/01a07865-lixo 2>&1 | tail -2
          git add downloads-gwen 2>/tmp/add.log || echo "::error::add: $(tail -c 300 /tmp/add.log | tr '\n' ' ')"
          git commit -m "CI: downloaded Gwen household + CC [skip ci]" 2>/tmp/commit.log || echo "::error::commit: $(tail -c 300 /tmp/commit.log | tr '\n' ' ')"
          git push origin HEAD:arena/01a07865-lixo 2>/tmp/push.log || echo "::error::push: $(tail -c 400 /tmp/push.log | tr '\n' ' ')"
          echo "echo-concluido"
