name: Download Gwen household + CC

on:
  push:
    paths:
      - '.github/workflows/download-gwen.yml'
      - 'scripts/download_gwen.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests cloudscraper

      - name: Download Gwen + required CC
        run: python scripts/download_gwen.py

      - name: Download Gwen round 2
        run: python scripts/download_gwen2.py || true

      - name: List results
        run: |
          ls -laR downloads-gwen

      - name: Split files over 90MB (GitHub limit)
        run: |
          cd downloads-gwen
          find . -type f -size +90M -print0 | while IFS= read -r -d '' f; do
            echo "splitting $f"
            split -b 90M -d "$f" "$f.part-"
            rm -f "$f"
            base="$f"
            printf '%s\n' "Arquivo dividido em partes (limite de 100MB do GitHub)." "Remontar:" "  Windows cmd: copy /b $(basename "$base").part-00+$(basename "$base").part-01+demais $(basename "$base")" "  Linux/Mac: cat $(basename "$base").part-* > $(basename "$base")" > "$base.REMONTAR.txt"
          done
          true

      - name: Commit downloads to branch
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads-gwen 2>/tmp/add.log || echo "::error::add: $(tail -c 300 /tmp/add.log | tr '\n' ' ')"
          git commit -m "CI: downloaded Gwen household + CC [skip ci]" 2>/tmp/commit.log || echo "::error::commit: $(tail -c 300 /tmp/commit.log | tr '\n' ' ')"
          git push origin HEAD:arena/01a07865-lixo 2>/tmp/push.log || echo "::error::push: $(tail -c 400 /tmp/push.log | tr '\n' ' ')"
          echo fim-do-step
