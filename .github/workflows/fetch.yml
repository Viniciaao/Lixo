name: fetch-sources

on:
  push:
    branches: [arena/**]
    paths:
      - 'scripts/fetch_sources.py'
      - '.github/workflows/fetch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install requests
      - name: Fetch CC sources
        run: |
          mkdir -p work
          set +e
          python3 scripts/fetch_sources.py > work/fetch_log.txt 2>&1
          rc=$?
          set -e
          echo "fetch-exit=$rc run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> work/fetch_log.txt
          echo "--- log tail ---"
          tail -60 work/fetch_log.txt
          echo "--- end log ---"
          exit 0
      - name: Commit fetched files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helene-dacosta-tudo-junto work
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "fetch: CC files for Helene Dacosta pack"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "committed and pushed"
          fi
