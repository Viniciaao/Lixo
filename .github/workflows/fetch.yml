name: fetch-sources

on:
  push:
    branches: [arena/**]
    paths:
      - 'scripts/fetch_sources.py'
      - '.github/workflows/fetch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install requests
      - name: Fetch CC sources
        run: |
          mkdir -p work
          set +e
          python3 scripts/fetch_sources.py > work/fetch_log.txt 2>&1
          rc=$?
          set -e
          echo "fetch-exit=$rc run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> work/fetch_log.txt
          echo "--- log tail ---"
          tail -60 work/fetch_log.txt
          echo "--- end log ---"
          exit 0
      - name: Commit fetched files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ${GITHUB_REF_NAME}
          { echo "=== top staged sizes ==="
            git ls-files -z helene-dacosta-tudo-junto work | xargs -0 -r stat -c "%s %n" 2>/dev/null | sort -rn | head -15
          } > work/fetch_diag.txt
          git add helene-dacosta-tudo-junto work
          big_list=""
          while IFS= read -r f; do
            s=$(stat -c %s "$f" 2>/dev/null)
            if [ -n "$s" ] && [ "$s" -gt 95000000 ]; then
              echo "TOO_BIG: $f ($s bytes) - not committed" >> work/fetch_diag.txt
              big_list="$big_list $f"
            fi
          done < <(git diff --cached --name-only -z | tr '\0' '\n')
          for f in $big_list; do git reset -q -- "$f"; rm -f "$f"; done
          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT" >> work/fetch_diag.txt
          else
            git commit -m "fetch: CC files for Helene Dacosta pack"
            pushed=0
            for i in 1 2 3 4 5 6; do
              out=$(git push origin HEAD:${GITHUB_REF_NAME} 2>&1)
              if [ $? -eq 0 ]; then
                echo "PUSHED OK (attempt $i)" >> work/fetch_diag.txt
                pushed=1
                break
              fi
              echo "push attempt $i failed: $(echo "$out" | tail -2)" >> work/fetch_diag.txt
              git fetch origin ${GITHUB_REF_NAME} >/dev/null 2>&1
              git rebase FETCH_HEAD >/dev/null 2>&1
            done
            if [ "$pushed" = "0" ]; then
              echo "PUSH FAILED AFTER RETRIES" >> work/fetch_diag.txt
            fi
          fi
          echo "==== tail of fetch log ====" >> work/fetch_diag.txt
          tail -80 work/fetch_log.txt >> work/fetch_diag.txt
          b64=$(base64 -w0 < work/fetch_diag.txt)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/work/fetch_diag.txt" \
            -f message="ci: fetch diagnostics" -f content="$b64" -f branch="${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            && echo "diagnostics pushed via Contents API" \
            || echo "diagnostics API push failed"
          exit 0
