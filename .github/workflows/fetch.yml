name: fetch-sources

on:
  push:
    branches: [arena/**]
    paths:
      - 'scripts/fetch_sources.py'
      - '.github/workflows/fetch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install requests
      - name: Fetch CC sources
        run: |
          mkdir -p work
          set +e
          python3 scripts/fetch_sources.py > work/fetch_log.txt 2>&1
          rc=$?
          set -e
          echo "fetch-exit=$rc run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> work/fetch_log.txt
          echo "--- log tail ---"
          tail -60 work/fetch_log.txt
          echo "--- end log ---"
          exit 0
      - name: Commit fetched files
        if: always()
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ${GITHUB_REF_NAME} 2>&1 | tail -2
          git add helene-dacosta-tudo-junto work
          if git diff --cached --quiet; then
            echo "NO CHANGES TO COMMIT"
            exit 0
          fi
          git commit -m "fetch: CC files for Helene Dacosta pack"
          for i in 1 2 3 4 5 6; do
            git push origin HEAD:${GITHUB_REF_NAME} > work/git_push_out.txt 2>&1
            if [ $? -eq 0 ]; then
              echo "PUSHED OK (attempt $i)"
              exit 0
            fi
            echo "push attempt $i failed: $(head -2 work/git_push_out.txt)"
            sleep 5
            git fetch origin ${GITHUB_REF_NAME} >/dev/null 2>&1
            git rebase FETCH_HEAD >/dev/null 2>&1
          done
          echo "ALL PUSH ATTEMPTS FAILED"
          git status --short | head -20
          exit 0
