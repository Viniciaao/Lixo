name: Create release with zips

on:
  push:
    paths:
      - '.github/workflows/create-release.yml'
      - 'scripts/make_release.sh'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release'
        required: true
        default: 'v1.0-sims-cc'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || 'v1.0-sims-cc' }}

      - name: Create release (com log commitado)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/make_release.sh "v1.0-sims-cc" || true

      - name: Commit debug log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-debug.log release-exit.txt 2>/dev/null || true
          git commit -m "release debug [skip ci]" || echo "nada para commitar"
          git fetch origin arena/01a07865-lixo || true
          git push origin HEAD:arena/01a07865-lixo || echo "push falhou (ok se release deu certo)"
